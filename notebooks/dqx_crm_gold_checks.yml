- name: dim_selfperform_opportunity_id_not_null
  table_name: gold_dim_selfperform
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: opportunity_id

- name: dim_selfperform_composite_key_unique
  table_name: gold_dim_selfperform
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
        - opportunity_id
        - self_perform_id

- name: dim_selfperform_fk_opportunity_id
  table_name: gold_dim_selfperform
  criticality: warn
  check:
    function: foreign_key
    arguments:
      columns:
        - opportunity_id
      ref_columns:
        - opportunity_id
      ref_table: __PREFIX__crm_data.opportunities.gold_opportunities_fact

- name: dim_selfperform_discipline_not_null_or_empty
  table_name: gold_dim_selfperform
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: self_perform_discipline IS NOT NULL AND TRIM(self_perform_discipline) != ''

- name: dim_selfperform_discipline_in_master_data_list
  table_name: gold_dim_selfperform
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: |-
        CASE self_perform_discipline
          WHEN 'CO - Concrete/Resteel' THEN 'Concrete'
          WHEN 'RG - Rigging' THEN 'Rigging'
          WHEN 'CV - Civil' THEN 'Civil'
          WHEN 'IN - Interiors' THEN 'Interiors'
          WHEN 'ST - Steel' THEN 'Structural Steel'
          WHEN 'BM - Boilermaker' THEN 'Boilermaker'
          WHEN 'GT - General Trades (Builders)' THEN 'General Trades (Builders)'
          WHEN 'CR - Controlled Environments' THEN 'Controlled Environments'
          WHEN 'SM - Solar Mechanical' THEN 'Solar Mechanical'
          WHEN 'RF - Refractory' THEN 'Refractory'
          ELSE self_perform_discipline
        END IN (
          SELECT term_name FROM __PREFIX__enterprise.master_data.gold_self_perform_discipline
          WHERE master_data_type = 'Self-perform Discipline' AND is_active = 'Active'
        )



