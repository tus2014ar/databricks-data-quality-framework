  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
        - opportunity_id
        - valid_from

- name: gng_scd_type2_integrity
  table_name: gold_gng_scd
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: (current_flag = TRUE AND valid_to IS NULL) OR (current_flag = FALSE AND valid_to IS NOT NULL)

- name: gng_scd_validity_period_ordered
  table_name: gold_gng_scd
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: valid_to IS NULL OR valid_to > valid_from

- name: gng_scd_max_one_active_record
  table_name: gold_gng_scd
  criticality: error
  filter: current_flag = TRUE
  check:
    function: is_aggr_not_greater_than
    arguments:
      column: opportunity_id
      aggr_type: count
      group_by:
        - opportunity_id
      limit: 1

- name: gng_scd_valid_from_not_in_future
  table_name: gold_gng_scd
  criticality: warn
  check:
    function: is_not_in_future
    arguments:
      column: valid_from

- name: gng_scd_go_no_go_required_from_stage_4
  table_name: gold_gng_scd
  criticality: warn
  filter: stage_number >= 4 AND current_flag = TRUE
  check:
    function: sql_expression
    arguments:
      expression: >-
        go_no_go_recommendation IS NOT NULL
        AND TRIM(go_no_go_recommendation) != ''


- name: gng_scd_go_no_go_valid_value_by_stage
  table_name: gold_gng_scd
  criticality: warn
  filter: go_no_go_recommendation IS NOT NULL AND current_flag = TRUE
  check:
    function: sql_expression
    arguments:
      expression: >-
        CASE
          WHEN stage_number BETWEEN 1 AND 3
            THEN go_no_go_recommendation IN ('Conditional', 'Discuss')
          WHEN stage_number >= 4
            THEN go_no_go_recommendation IN ('Conditional', 'Discuss', 'Go', 'No-Go')
          ELSE TRUE
        END

