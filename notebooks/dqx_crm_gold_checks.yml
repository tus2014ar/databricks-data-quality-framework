# dqx_crm_gold_checks.yml
#
# DQX quality checks for all 23 gold tables in crm_data.opportunities.
# DQX version: databricks-labs-dqx[llm]==0.15.0
#
# Rules are grouped by table using comment headers below.


# ============================================================
# TABLE: gold_opportunities_fact
# ============================================================

- name: opportunity_id_unique
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
        - opportunity_id

- name: required_columns_not_null
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: is_not_null
    for_each_column:
      - opportunity_id
      - opportunity_name
      - client
      - opportunity_number
      - stage
      - date_created
      - construction_start_date
      - construction_completion_date
      - last_modified_date_time
      - construction_value
      - base_fee_percent

- name: ratios_in_range
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: is_in_range
    for_each_column:
      - jv_ownership_percent
      - fy1_percent_complete
      - fy2_percent_complete
      - fy3_percent_complete
      - fy4_percent_complete
      - win_probability
      - project_probability
      - base_fee_percent
    arguments:
      min_limit: 0.0
      max_limit: 1.0

- name: non_negative_numeric_fields
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: is_not_less_than
    for_each_column:
      - construction_value
      - trade_labor_hours
      - duration_months
      - opportunity_revenue
      - opportunity_fee
    arguments:
      limit: 0

- name: valid_url_link
  table_name: gold_opportunities_fact
  criticality: warn
  check:
    function: regex_match
    arguments:
      column: url_link
      regex: '^https?://.+'

- name: opportunity_name_client_not_empty
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: |-
        TRIM(opportunity_name) != '' AND TRIM(client) != ''

- name: anticipated_award_date_future_unless_booked
  table_name: gold_opportunities_fact
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: |-
        CASE
          WHEN stage_number IN (1,2,3,4,5) AND anticipated_booking_date IS NULL
            THEN anticipated_award_date > CURRENT_DATE
          WHEN stage_number IN (1,2,3,4,5) AND anticipated_booking_date IS NOT NULL
            THEN anticipated_booking_date > CURRENT_DATE
          ELSE TRUE
        END

- name: anticipated_booking_date_future
  table_name: gold_opportunities_fact
  criticality: warn
  filter: stage_number IN (1,2,3,4,5,6)
  check:
    function: sql_expression
    arguments:
      expression: anticipated_booking_date > CURRENT_DATE

- name: construction_start_date_future
  table_name: gold_opportunities_fact
  criticality: warn
  filter: stage_number IN (1,2,3,4,5,6)
  check:
    function: sql_expression
    arguments:
      expression: construction_start_date > CURRENT_DATE

- name: construction_completion_after_start
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: construction_completion_date > construction_start_date

- name: fy_percent_complete_co_population
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: |-
        (fy1_percent_complete IS NULL AND fy2_percent_complete IS NULL
         AND fy3_percent_complete IS NULL AND fy4_percent_complete IS NULL)
        OR (fy1_percent_complete IS NOT NULL AND fy2_percent_complete IS NOT NULL
         AND fy3_percent_complete IS NOT NULL AND fy4_percent_complete IS NOT NULL)

- name: fy_percent_complete_cumulative_order
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: (fy2_percent_complete IS NULL OR fy1_percent_complete IS NULL OR fy2_percent_complete >= fy1_percent_complete) AND (fy3_percent_complete IS NULL OR fy2_percent_complete IS NULL OR fy3_percent_complete >= fy2_percent_complete) AND (fy4_percent_complete IS NULL OR fy3_percent_complete IS NULL OR fy4_percent_complete >= fy3_percent_complete)

- name: win_project_probability_not_null_and_in_range
  table_name: gold_opportunities_fact
  criticality: error
  check:
    function: sql_expression
    arguments:
      expression: |-
        win_probability IS NOT NULL AND win_probability BETWEEN 0.0 AND 1.0
        AND project_probability IS NOT NULL AND project_probability BETWEEN 0.0 AND 1.0

- name: win_project_probability_not_zero
  table_name: gold_opportunities_fact
  criticality: warn
  filter: stage_number BETWEEN 2 AND 5
  check:
    function: sql_expression
    arguments:
      expression: NOT (win_probability = 0.0 OR project_probability = 0.0)

- name: stage_number_observed_range
  table_name: gold_opportunities_fact
  criticality: warn
  check:
    function: is_in_range
    arguments:
      column: stage_number
      min_limit: 1
      max_limit: 8

- name: latest_days_in_stage_not_negative
  table_name: gold_opportunities_fact
  criticality: warn
  check:
    function: is_not_less_than
    arguments:
      column: latest_days_in_stage
      limit: 0


